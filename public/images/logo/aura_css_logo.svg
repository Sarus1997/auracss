<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1240" width="1240" height="1240" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Aura CSS Logo</title>
  <defs>
    <linearGradient id="gTop" x1="480" y1="280" x2="800" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2fe6ff"/>
      <stop offset="0.45" stop-color="#2f5bff"/>
      <stop offset="0.8" stop-color="#7a2cf5"/>
      <stop offset="1" stop-color="#e24df0"/>
    </linearGradient>
    <linearGradient id="gLeg" x1="560" y1="280" x2="330" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2fe6ff"/>
      <stop offset="0.55" stop-color="#2a55ff"/>
      <stop offset="1" stop-color="#1f2fe0"/>
    </linearGradient>
    <linearGradient id="gBottom" x1="180" y1="900" x2="1100" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#27d9ff"/>
      <stop offset="0.35" stop-color="#2a45f5"/>
      <stop offset="0.7" stop-color="#2b1fc9"/>
      <stop offset="0.85" stop-color="#b13cf2"/>
      <stop offset="1" stop-color="#2fe0ff"/>
    </linearGradient>
    <linearGradient id="gRing" x1="125" y1="760" x2="1140" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e64df2"/>
      <stop offset="0.25" stop-color="#3a62ff"/>
      <stop offset="0.5" stop-color="#d84ff0"/>
      <stop offset="0.75" stop-color="#4a6bff"/>
      <stop offset="1" stop-color="#7fe9ff"/>
    </linearGradient>
    <linearGradient id="gInner" x1="630" y1="420" x2="860" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b3cf0"/>
      <stop offset="0.6" stop-color="#7a2cf5"/>
      <stop offset="1" stop-color="#e24df0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Lower arch + legs -->
    <path fill="url(#gBottom)" d="M240,740 L170,915 Q290,890 400,880 Q480,790 580,735 Q700,675 790,692 Q860,705 885,885 Q1000,895 1103,915 L910,605 L600,700 Z"/>
    <path fill="none" stroke="#3be3ff" stroke-width="3" opacity=".7" d="M790,692 Q700,675 580,735 Q480,790 400,880"/>

    <!-- Upper A -->
    <path fill="url(#gLeg)" d="M553,277 L700,272 L628,415 L497,640 L265,722 Z"/>
    <path fill="url(#gInner)" d="M700,272 L860,520 L720,568 L628,415 Z"/>

    <!-- Orbit ring -->
    <path fill="url(#gRing)" d="M125,760 C140,810 260,800 420,750 C700,670 1000,550 1120,450 C1160,415 1140,380 1060,360 C1000,352 900,358 830,378 C920,370 1030,380 1070,410 C1090,440 1000,490 880,540 C700,610 450,700 280,725 C200,735 170,710 185,685 C215,630 290,570 355,545 C250,575 150,650 125,760 Z"/>
    <path fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="3" d="M420,735 C700,655 1000,545 1110,445"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
